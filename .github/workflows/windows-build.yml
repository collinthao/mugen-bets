name: Build and package Mugen-Bets

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Allow workflow to create/update releases with GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore Mugen-Bets.slnx

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Build solution (locate MSBuild and run)
        shell: pwsh
        run: |
          $msbuild = $null
          $msbuildCmd = Get-Command msbuild -ErrorAction SilentlyContinue
          if ($msbuildCmd) { $msbuild = $msbuildCmd.Source }
          if (-not $msbuild) {
            $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $inst = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
              if ($inst) {
                $candidate = Join-Path $inst "MSBuild\Current\Bin\MSBuild.exe"
                if (Test-Path $candidate) { $msbuild = $candidate }
              }
            }
          }
          if (-not $msbuild -or -not (Test-Path $msbuild)) { Write-Error "MSBuild not found on runner"; exit 1 }
          & $msbuild "Mugen-Bets.slnx" /m /p:Configuration=Release /p:Platform=x64

      - name: Locate exe and prepare artifact
        shell: pwsh
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\build_artifact"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.exe -Recurse | Where-Object { $_.Name -match 'Mugen-Bets.exe' } | Select-Object -First 1
          if (-not $exe) { Write-Error "Executable not found"; exit 1 }
          Copy-Item -Path $exe.FullName -Destination $outDir -Force
          # Ensure all required runtime data is included.
          $repoRoot = $env:GITHUB_WORKSPACE
          $exeDir = Split-Path $exe.FullName

          # Check common locations for the mugen-1.1b1 folder (explicit paths) first
          $candidates = @(
            (Join-Path $repoRoot 'Mugen-Bets\mugen-1.1b1'),
            (Join-Path $repoRoot 'mugen-1.1b1'),
            (Join-Path $repoRoot 'Mugen-Bets\mugen-1.1b1\mugen-1.1b1'),
            (Join-Path $exeDir 'mugen-1.1b1')
          )
          $foundMugen = $null
          foreach ($p in $candidates) {
            if (Test-Path $p) { $foundMugen = Get-Item $p; break }
          }
          # Fallback: robust recursive search for directory name 'mugen-1.1b1'
          if (-not $foundMugen) { $foundMugen = Get-ChildItem -Path $repoRoot -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq 'mugen-1.1b1' } | Select-Object -First 1 }
          if ($foundMugen) {
            Write-Host "Copying mugen-1.1b1 from $($foundMugen.FullName) -> $outDir"
            Copy-Item -Path $foundMugen.FullName -Destination $outDir -Recurse -Force
          }
          else {
            Write-Host "mugen-1.1b1 folder not found in repo or next to build output"
          }

          # Also ensure chars directories are present (search repo and build output)
          # Also find any 'chars' directories anywhere in the repo or next to build output and include them
          $charsFound = Get-ChildItem -Path $repoRoot -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq 'chars' }
          if (-not $charsFound) { $charsFound = Get-ChildItem -Path $exeDir -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq 'chars' } }
          foreach ($c in $charsFound) {
            Write-Host "Copying chars folder: $($c.FullName) -> $outDir\chars"
            $dest = Join-Path $outDir 'chars'
            Copy-Item -Path $c.FullName -Destination $dest -Recurse -Force
          }

          # Copy other common asset folders if present in repo root
          $otherFolders = @('data','stages','sound')
          foreach ($f in $otherFolders) {
            $src = Join-Path $repoRoot $f
            if (Test-Path $src) { Write-Host "Copying $src -> $outDir"; Copy-Item -Path $src -Destination $outDir -Recurse -Force }
          }

          # Copy any mugen engine executables found anywhere in the repo or next to build output
          $engineExes = @()
          $engineExes += Get-ChildItem -Path $exeDir -Filter 'mugen*.exe' -File -ErrorAction SilentlyContinue
          $engineExes += Get-ChildItem -Path $repoRoot -Filter 'mugen*.exe' -Recurse -File -ErrorAction SilentlyContinue
          $engineExes = $engineExes | Select-Object -Unique
          foreach ($eng in $engineExes) {
            $destPath = Join-Path $outDir (Split-Path $eng.FullName -Leaf)
            if ($eng.FullName -ieq $destPath) {
              Write-Host "Skipping copy of $($eng.FullName) — already in artifact"
            }
            else {
              Write-Host "Including engine exe: $($eng.FullName) -> $outDir"
              Copy-Item -Path $eng.FullName -Destination $outDir -Force
            }
          }
          # Copy any dll/pdb sitting next to the exe
          $exeDir = Split-Path $exe.FullName
          Get-ChildItem -Path $exeDir -Include *.dll,*.pdb -File | ForEach-Object { Copy-Item -Path $_.FullName -Destination $outDir -Force }

      - name: Zip artifact
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\Mugen-Bets-release.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\build_artifact\*" -DestinationPath $zip -Force

      - name: Create-or-find public Release and upload asset (REST)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $token = $env:GITHUB_TOKEN
          $repoFull = $env:GITHUB_REPOSITORY
          $parts = $repoFull -split '/' 
          $owner = $parts[0]
          $repo = $parts[1]
          $tag = 'Release'
          $apiBase = "https://api.github.com/repos/$owner/$repo"
          $headers = @{ Authorization = "token $token"; Accept = 'application/vnd.github.v3+json' }

          Write-Host "Checking for existing release $tag"
          try {
            $release = Invoke-RestMethod -Uri "$apiBase/releases/tags/$tag" -Headers $headers -Method Get -ErrorAction Stop
            Write-Host "Found existing release id=$($release.id)"
            $releaseId = $release.id
          }
          catch {
            Write-Host "Release not found; creating"
            $body = @{ tag_name = $tag; name = $tag; body = "Automated CI build"; draft = $false; prerelease = $false } | ConvertTo-Json
            $release = Invoke-RestMethod -Uri "$apiBase/releases" -Headers $headers -Method Post -Body $body -ContentType 'application/json' -ErrorAction Stop
            $releaseId = $release.id
            Write-Host "Created release id=$releaseId"
          }

          $assetPath = "$env:GITHUB_WORKSPACE\Mugen-Bets-release.zip"
          if (-not (Test-Path $assetPath)) { Write-Error "Asset not found: $assetPath"; exit 1 }
          $fileName = Split-Path $assetPath -Leaf
          $escapedName = [System.Uri]::EscapeDataString($fileName)
          $uploadUri = "https://uploads.github.com/repos/$owner/$repo/releases/$releaseId/assets?name=$escapedName"
          Write-Host "uploadUri: $uploadUri"
          $headers = @{ Authorization = "token $token"; Accept = 'application/vnd.github.v3+json' }
          # Check for existing asset with same name and delete it to allow re-upload
          try {
            $assets = Invoke-RestMethod -Uri "$apiBase/releases/$releaseId/assets" -Headers $headers -Method Get -ErrorAction Stop
            $existing = $assets | Where-Object { $_.name -eq $fileName } | Select-Object -First 1
            if ($existing) {
              Write-Host "Deleting existing asset id=$($existing.id) name=$($existing.name)"
              Invoke-RestMethod -Uri "https://api.github.com/repos/$owner/$repo/releases/assets/$($existing.id)" -Headers $headers -Method Delete -ErrorAction Stop
            }
          }
          catch {
            Write-Host "No existing assets or failed to list assets: $_"
          }

          Invoke-RestMethod -Uri $uploadUri -Headers $headers -Method Post -InFile $assetPath -ContentType 'application/zip' -ErrorAction Stop
          Write-Host "Upload complete"

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: "Automated release for ${{ github.ref_name }}"

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: Mugen-Bets-release.zip
          asset_name: Mugen-Bets-release-${{ github.ref_name }}.zip
          asset_content_type: application/zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mugen-Bets-release
          path: Mugen-Bets-release.zip
